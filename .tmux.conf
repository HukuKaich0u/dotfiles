# ==============================
# 基本設定
# ==============================

# Prefix を Ctrl-a に変更し、Ctrl-b はシェル側で使えるようにする
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ターミナル種別と色まわりを安定させる
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# ESC の反応を速くする
set-option -s escape-time 0

# スクロールバック履歴を多めに保持する
set-option -g history-limit 100000

# フォーカス移動や特殊キーの認識を改善する
set-option -g focus-events on
set-window-option -g xterm-keys on

# ==============================
# window / pane の番号まわり
# ==============================

# window 番号と pane 番号を 1 始まりにする
set-option -g base-index 1
set-window-option -g pane-base-index 1

# window を閉じたあとに番号を詰め直す
set-option -g renumber-windows on

# prefix + q で表示される pane 番号を少し長めに表示する
set-option -g display-panes-time 2000

# ==============================
# pane / window 操作
# ==============================

# pane 分割のデフォルトキーを無効化する
unbind '"'
unbind %

# pane の分割キーを WezTerm に寄せる
bind-key H split-window -hb -c "#{pane_current_path}"
bind-key J split-window -v -c "#{pane_current_path}"
bind-key K split-window -vb -c "#{pane_current_path}"
bind-key L split-window -h -c "#{pane_current_path}"

# Vim ライクに pane を移動できるようにする
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# pane サイズ調整モードに入る
bind-key s switch-client -T resize-pane

# pane の拡大表示を切り替える
bind-key z resize-pane -Z

# pane を閉じる
bind-key x confirm-before -p "pane を閉じますか? (y/n)" kill-pane

# resize モード中は h/j/k/l で pane サイズを調整する
bind-key -T resize-pane h resize-pane -L 5
bind-key -T resize-pane j resize-pane -D 5
bind-key -T resize-pane k resize-pane -U 5
bind-key -T resize-pane l resize-pane -R 5
bind-key -T resize-pane Enter switch-client -T root
bind-key -T resize-pane Escape switch-client -T root

# ==============================
# copy mode
# ==============================

# コピーモードを Vim ライクな操作にする
set-option -g mode-keys vi

# WezTerm に寄せて prefix + [ でコピーモードに入る
bind-key [ copy-mode

# コピーモードを Vim ライクな操作にする
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# ==============================
# マウス / スクロール
# ==============================

# マウス操作とスクロールを有効にする
set-option -g mouse on

# 通常 pane 上でもホイールで履歴をスクロールできるようにする
bind-key -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e \\; send-keys -X scroll-up"
bind-key -n WheelDownPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "send-keys -X scroll-down"

# コピーモード中もホイールでスクロールできるようにする
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# ==============================
# 補助操作
# ==============================

# 設定ファイルを再読み込みしやすくする
bind-key r source-file ~/.tmux.conf \; display-message ".tmux.conf を再読み込みしました"
