add_newline = true

format = """
${custom.userhost}\
$directory  \
$git_branch\
$docker_context\
$kubernetes\
$terraform\
$direnv\
$fill\
$cmd_duration\
$time\
\n$character\
"""

# Enable if it appears on the same line as the command
# right_format = """
# $cmd_duration\
# $time\
# """

[python]
format = """
[](fg:#ffcb6b)\
[$virtualenv]($style)\
[](fg:#ffcb6b)\
"""
style = "bold fg:#313244 bg:#ffcb6b"

[fill]
symbol = "─"

[custom.userhost]
command = "printf '%s@%s' \"$USER\" \"$(hostname -s)\""
when = "true"
format = """
[](fg:#d66f4a)\
[$output]($style)\
[](fg:#d66f4a bg:#f6e58d)\
"""
style = "bold fg:#fff8f1 bg:#d66f4a"

[directory]
truncation_length = 6
truncation_symbol = " "
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾 "
format = """
[ ](bg:#f6e58d)\
[$path]($style)\
[$read_only]($read_only_style)\
[](fg:#f6e58d)\
"""
style = "bold fg:#4f3b00 bg:#f6e58d"
read_only_style = "bold fg:#4f3b00 bg:#f6e58d"

[direnv]
disabled = false
format = """
[](fg:#89dceb)\
[$symbol$allowed]($style)\
[](fg:#89dceb)\
"""
style = "bold fg:#313244 bg:#89dceb"

[git_branch]
symbol = ""
style = "bold fg:#eef7ff bg:#4f8fba"
format = """
[](fg:#4f8fba)\
[$symbol $branch]($style)\
[](fg:#4f8fba bg:#2f3e4e)\
"""

[docker_context]
only_with_files = true
detect_files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
symbol = ""
style = "bold fg:#e9f7ff bg:#3f7ea6"
format = """
[ ](bg:#3f7ea6)\
[$symbol $context]($style)\
[](fg:#3f7ea6 bg:#2f3e4e)\
"""

[kubernetes]
disabled = false
symbol = "☸"
detect_files = ["k8s.yaml", "k8s.yml", "kustomization.yaml", "kustomization.yml", "Chart.yaml", "helmfile.yaml", "helmfile.yml"]
detect_folders = ["k8s", "kubernetes", "helm", "charts"]
style = "bold fg:#eef7ff bg:#4f6fb8"
format = """
[ ](bg:#4f6fb8)\
[$symbol $context( \\($namespace\\))]($style)\
[](fg:#4f6fb8 bg:#2f3e4e)\
"""

[terraform]
symbol = "󱁢"
detect_extensions = ["tf", "tfplan", "tfstate"]
detect_files = [".terraform.lock.hcl"]
detect_folders = [".terraform"]
style = "bold fg:#f2ecff bg:#7b5db6"
format = """
[ ](bg:#7b5db6)\
[$symbol $workspace]($style)\
[](fg:#7b5db6 bg:#2f3e4e)\
"""

[git_status]
style = "fg:#769ff0 bg:#1d2230"
format = """
[$all_status$ahead_behind]($style)\
[](fg:#1d2230)\
"""

[cmd_duration]
min_time = 1
style = "fg:#e0af68"
format = "[ $duration]($style)"

[time]
disabled = false
time_format = "%R"
style = "bold fg:#eef6ff bg:#2f3e4e"
format = """
[ ](bg:#2f3e4e)\
[ $time]($style)\
[](fg:#2f3e4e)\
"""

[character]
vimcmd_symbol = "[V](bold green) "

