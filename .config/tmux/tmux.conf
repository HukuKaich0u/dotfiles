# ==============================
# 基本設定
# ==============================

# Prefix を Ctrl-a に変更し、Ctrl-b はシェル側で使えるようにする
unbind C-b
set-option -g prefix C-g
bind-key C-g send-prefix

# ターミナル種別と色まわりを安定させる
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",tmux-256color:RGB"
set-option -sa terminal-features ",xterm-256color:RGB"

# ESC の反応を速くする
set-option -s escape-time 0

# スクロールバック履歴を多めに保持する
set-option -g history-limit 100000

# フォーカス移動や特殊キーの認識を改善する
set-option -g focus-events on
set-window-option -g xterm-keys on

# ==============================
# window / pane の番号まわり
# ==============================

# window 番号と pane 番号を 1 始まりにする
set-option -g base-index 1
set-window-option -g pane-base-index 1

# window を閉じたあとに番号を詰め直す
set-option -g renumber-windows on

# prefix + q で表示される pane 番号を少し長めに表示する
set-option -g display-panes-time 2000

# ==============================
# pane / window 操作
# ==============================

# pane 分割のデフォルトキーを無効化する
unbind '"'
unbind %

# pane の分割キーを WezTerm に寄せる
bind-key H split-window -hb -c "#{pane_current_path}"
bind-key J split-window -v -c "#{pane_current_path}"
bind-key K split-window -vb -c "#{pane_current_path}"
bind-key L split-window -h -c "#{pane_current_path}"

# Vim ライクに pane を移動できるようにする
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# pane の拡大表示を切り替える
bind-key z resize-pane -Z

# pane を閉じる
bind-key x confirm-before -p "pane を閉じますか? (y/n)" kill-pane

# pane サイズ調整モードに入る
bind-key s switch-client -T resize-pane
# resize モード中は h/j/k/l で pane サイズを調整する
bind-key -T resize-pane h resize-pane -L 5
bind-key -T resize-pane j resize-pane -D 5
bind-key -T resize-pane k resize-pane -U 5
bind-key -T resize-pane l resize-pane -R 5
bind-key -T resize-pane Enter switch-client -T root
bind-key -T resize-pane Escape switch-client -T root

# ==============================
# copy mode
# ==============================

# コピーモードを Vim ライクな操作にする
set-option -g mode-keys vi

# WezTerm に寄せて prefix + [ でコピーモードに入る
bind-key [ copy-mode

# コピーモードを Vim ライクな操作にする
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# ==============================
# マウス / スクロール
# ==============================

# マウス操作とスクロールを有効にする
set-option -g mouse on

# 通常 pane 上でホイールを上に回すと copy mode に入って履歴を見られるようにする
bind-key -n WheelUpPane if-shell -F -t= "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# コピーモード中もホイールでスクロールできるようにする
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 5 scroll-down

# ==============================
# 見た目
# ==============================

# ベースカラー
set-option -g @bg "#111111"
set-option -g @bg-alt "#1c1c1c"
set-option -g @fg "#e4e4e4"
set-option -g @muted "#8a8a8a"
set-option -g @accent "#87af87"
set-option -g @accent-strong "#a1c98b"
set-option -g @warn "#d7af5f"

# status bar
set-option -g status on
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-interval 5
set-option -g status-style "bg=#{@bg},fg=#{@fg}"
set-option -g status-left-length 30
set-option -g status-right-length 80
set-option -g status-left "#[bg=#{@accent},fg=#{@bg},bold] #S #[bg=#{@bg},fg=#{@accent}]│"
set-option -g status-right "#[fg=#{@muted}]#{pane_current_path} #[fg=#{@accent}]│ #[fg=#{@fg}]%Y-%m-%d %H:%M "

# window 表示
set-window-option -g window-status-format "#[fg=#{@muted}] #I:#W "
set-window-option -g window-status-current-format "#[bg=#{@bg-alt},fg=#{@accent-strong},bold] #I:#W "
set-window-option -g window-status-separator ""
set-window-option -g window-status-activity-style "fg=#{@warn},bold"
set-window-option -g window-status-bell-style "fg=#{@warn},bold"

# pane 境界線
set-option -g pane-border-style "fg=#{@bg-alt}"
set-option -g pane-active-border-style "fg=#{@accent}"

# copy mode / message 表示
set-window-option -g mode-style "bg=#{@accent},fg=#{@bg}"
set-option -g message-style "bg=#{@bg-alt},fg=#{@fg}"
set-option -g message-command-style "bg=#{@accent},fg=#{@bg}"

# ==============================
# 補助操作
# ==============================

# 設定ファイルを再読み込みしやすくする
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf を再読み込みしました"
