onboarding = false

[theme]
name = "terminal"

[terminal]
new_cwd = "follow"

[keys]
prefix = "ctrl+g"
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+q"
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+o"
goto = "prefix+w"
new_workspace = "prefix+shift+c"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "ctrl+1..9"
switch_workspace = ""
close_tab = "prefix+shift+x"
rename_pane = ""
copy_mode = "prefix+["
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+{"
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = "prefix+}"
last_pane = "prefix+;"
split_vertical = "prefix+shift+l"
split_horizontal = "prefix+shift+j"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+s"
toggle_sidebar = "prefix+b"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = ""

[[keys.command]]
key = "prefix+shift+h"
type = "pane"
command = "hunk diff --watch"
description = "review changes with Hunk"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "open lazygit in a popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazydocker"
description = "open lazydocker in a popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
description = "open yazi (file explorer) in a popup"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open a scratch terminal in a popup"
width = "80%"
height = "80%"

[ui]
sidebar_width = 30
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"
mouse_capture = true
confirm_close = true
prompt_new_tab_name = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = true

[experimental]
pane_history = false
