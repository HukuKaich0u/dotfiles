# ==============================
# 基本設定
# ==============================

# Prefix を Ctrl-a に変更し、Ctrl-b はシェル側で使えるようにする
unbind C-b
set-option -g prefix C-g
bind-key C-g send-prefix

# ターミナル種別と色まわりを安定させる
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",tmux-256color:RGB"
set-option -sa terminal-features ",wezterm:RGB"
set-option -sa terminal-features ",xterm*:RGB"
set-option -sa terminal-features ",xterm-256color:RGB"
set-option -sa terminal-overrides ",tmux-256color:Tc"
set-option -sa terminal-overrides ",wezterm:Tc"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# ESC の反応を速くする
set-option -s escape-time 0

# スクロールバック履歴を多めに保持する
set-option -g history-limit 100000

# フォーカス移動や特殊キーの認識を改善する
set-option -g focus-events on
set-window-option -g xterm-keys on

# ==============================
# window / pane の番号まわり
# ==============================

# window 番号と pane 番号を 1 始まりにする
set-option -g base-index 1
set-window-option -g pane-base-index 1

# window を閉じたあとに番号を詰め直す
set-option -g renumber-windows on

# prefix + q で表示される pane 番号を少し長めに表示する
set-option -g display-panes-time 2000

# ==============================
# pane / window 操作
# ==============================

# pane 分割のデフォルトキーを無効化する
unbind '"'
unbind %

# pane の分割キーを WezTerm に寄せる
bind-key H split-window -hb -c "#{pane_current_path}"
bind-key J split-window -v -c "#{pane_current_path}"
bind-key K split-window -vb -c "#{pane_current_path}"
bind-key L split-window -h -c "#{pane_current_path}"

# Vim ライクに pane を移動できるようにする
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# pane の拡大表示を切り替える
bind-key z resize-pane -Z

# pane を閉じる
bind-key x confirm-before -p "pane を閉じますか? (y/n)" kill-pane

# pane サイズ調整モードに入る
bind-key s switch-client -T resize-pane
# resize モード中は h/j/k/l を連打しても同じモードに残る
bind-key -T resize-pane h resize-pane -L 5 \; switch-client -T resize-pane
bind-key -T resize-pane j resize-pane -D 5 \; switch-client -T resize-pane
bind-key -T resize-pane k resize-pane -U 5 \; switch-client -T resize-pane
bind-key -T resize-pane l resize-pane -R 5 \; switch-client -T resize-pane
bind-key -T resize-pane q switch-client -T root
bind-key -T resize-pane Enter switch-client -T root
bind-key -T resize-pane Escape switch-client -T root

# ==============================
# copy mode
# ==============================

# コピーモードを Vim ライクな操作にする
set-option -g mode-keys vi

# WezTerm に寄せて prefix + [ でコピーモードに入る
bind-key [ copy-mode

# コピーモードを Vim ライクな操作にする
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# ==============================
# マウス / スクロール
# ==============================

# マウス操作とスクロールを有効にする
set-option -g mouse on

# 通常 pane 上でホイールを上に回すと copy mode に入って履歴を見られるようにする
bind-key -n WheelUpPane if-shell -F -t= "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# コピーモード中もホイールでスクロールできるようにする
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# ==============================
# 補助操作
# ==============================

# 設定ファイルを再読み込みしやすくする
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf を再読み込みしました"

# ==============================
# Plugins
# ==============================

# resurrect を定期保存し、tmux 起動時に自動復元する
set-option -g @resurrect-capture-pane-contents 'on'
set-option -g @resurrect-never-overwrite 'on'
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '5'

# Configure Catppuccin
set-option -g @catppuccin_flavor 'macchiato'
set-option -g @catppuccin_status_background 'none'
set-option -g @catppuccin_window_status_style 'none'
set-option -g @catppuccin_pane_status_enabled 'off'
set-option -g @catppuccin_pane_border_status "off"

# Configure Online
set-option -g @online_icon 'ok'
set-option -g @offline_icon 'nok'

# status left look and feel
set-option -g status-left-length 100
set-option -g status-left ""
set-option -ga status-left "#[bg=#1a1a1a,fg=#a6e3a1,#{?client_prefix,bold,none}] #{?client_prefix,,} #S "

set-option -ga status-left "#[bg=#1a1a1a,fg=#{@thm_surface_2},none]│"
set-option -ga status-left "#[bg=#1a1a1a,fg=#{@thm_sapphire}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set-option -ga status-left "#[bg=#1a1a1a,fg=#{@thm_surface_2},none]#{?window_zoomed_flag,│,}"
set-option -ga status-left "#[bg=#1a1a1a,fg=#{@thm_peach}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set-option -g status-right-length 250
set-option -g status-right ""

# Configure Tmux
set-option -g status-position bottom
set-option -g status-style "bg=default"
set-option -g status-justify "absolute-centre"
set-option -g popup-style "bg=#000000,fg=#c0caf5"
set-option -g popup-border-style "bg=#000000,fg=#414868"

# pane border look and feel
setw -g pane-border-status off
setw -g pane-border-lines heavy

# window look and feel
set-option -wg automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"

set-option -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set-option -g window-status-style "bg=default,fg=#{@thm_sapphire}"
set-option -g window-status-last-style "bg=default,fg=#{@thm_sapphire}"

set-option -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set-option -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set-option -gF window-status-separator "#[bg=default,fg=#{@thm_surface_1}]│"

set-option -g window-status-current-format "  #I#{?#{!=:#{window_name},Window},: #W,}  "
set-option -g window-status-current-style "bg=#{@thm_sapphire},fg=#{@thm_bg},bold"

# plugin load 後に上書きして pane border の色を固定する
setw -g pane-active-border-style "fg=#{@thm_yellow},bold"
setw -g pane-border-style "fg=#{@thm_surface_0}"
